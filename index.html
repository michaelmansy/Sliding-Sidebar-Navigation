<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Sidebar Menu</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>

    <nav class="sidebar">
        <div class="logo-items">
            <span class="nav-img">
                <img src="" alt="">
            </span>
            <span class="logo-name">Mayancoders</span>
        </div>

        <!-- Menu -->
        <div class="menu-container">
            <div class="menu-items">
                <ul class="menu-lists"> 
                    <div class="menu-title flex">
                        <span class="title">Dashboard</span>
                        <span class="line"></span>
                    </div>
                    <li class="list">
                        <a href="" class="link flex">
                            <span>Overview</span>
                        </a>
                    </li>
                    <li class="list">
                        <a href="" class="link flex">
                            <span>All Porjects</span>
                        </a>
                    </li>
                </ul>

                <ul class="menu-lists">
                    <div class="menu-title flex">
                        <span class="title">Editor</span>
                        <span class="line"></span>
                    </div>
                    <li class="list">
                        <a href="" class="link flex">
                            <span>Magic Build</span>
                        </a>
                    </li>
                    <li class="list">
                        <a href="" class="link flex">
                            <span>New Porjects</span>
                        </a>
                    </li>
                    <li class="list">
                        <a href="" class="link flex">
                            <span>Upload New</span>
                        </a>
                    </li>
                </ul>

                <ul class="menu-lists">
                    <div class="menu-title flex">
                        <span class="title">Settings</span>
                        <span class="line"></span>
                    </div>
                    <li class="list">
                        <a href="" class="link flex">
                            <i class='bx bx-flag'></i>
                            <span>Notice Board</span>
                        </a>
                    </li>
                    <li class="list">
                        <a href="" class="link flex">
                            <i class='bx bx-award'></i>
                            <span>Awards</span>
                        </a>
                    </li>
                    <li class="list">
                        <a href="" class="link flex">
                            <i class='bx bx-cog'></i>
                            <span>Settings</span>
                        </a>
                    </li>
                </ul>
            </div>

            <div class="sidebar-profile">
                <span class="nav-img">
                    <img src="" alt="">
                </span>
                <div class="data-text">
                    <span class="name">Mayan Coders</span>
                    <span class="email">mayancoders@gmail.com</span>
                </div>
            </div>
        </div>
    </nav>
    
    <nav class="navbar flex">
        <i class='bx bx-menu-alt-left'></i>
        <input type="text" placeholder="Search here..." class="search-box">
    </nav>
</body>
</html>
